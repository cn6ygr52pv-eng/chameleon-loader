<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chameleon Ultra Batch Loader</title>
<style>
  :root { --bg: #121212; --card: #1e1e1e; --accent: #00e676; --text: #ffffff; --muted: #9e9e9e; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 150px; }
  h2 { margin: 0 0 12px 0; font-size: 20px; }
  .panel { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  button { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 14px 16px; font-weight: 700; font-size: 16px; width: 100%; cursor: pointer; }
  button:disabled { background: #424242; color: #888; }
  button.secondary { background: #2c2c2c; color: #fff; margin-top: 8px; }
  input[type="file"], input[type="text"] { width: 100%; box-sizing: border-box; background: #2c2c2c; border: 1px solid #3c3c3c; color: #fff; padding: 10px; border-radius: 8px; font-size: 15px; margin-top: 8px; }
  .card-item { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 2px solid transparent; }
  .card-item.selected { border-color: var(--accent); background: #182b20; }
  .card-info { flex: 1; padding-right: 10px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-uid { font-family: monospace; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .slot-badge { background: var(--accent); color: #000; font-weight: 800; padding: 4px 10px; border-radius: 6px; font-size: 13px; min-width: 52px; text-align: center; }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; padding: 12px 16px; border-top: 1px solid #333; }
  #log { font-family: monospace; font-size: 12px; color: #00e676; white-space: pre-wrap; max-height: 90px; overflow-y: auto; margin-top: 8px; }
</style>
</head>
<body>

<h2>Chameleon Ultra Loader</h2>

<div class="panel">
  <button id="btnConnect" type="button">1. Подключить Chameleon Ultra</button>
  <div id="status" style="margin-top:8px; font-size:13px; color:#00e676;">Готов к работе</div>
</div>

<div class="panel">
  <div style="font-size:14px; font-weight:600;">2. Выберите JSON-файл с ключами</div>
  <input type="file" id="fileInput" accept=".json,application/json">
  <input type="text" id="searchInput" placeholder="Поиск по названию или UID..." style="display:none;">
  <button id="btnClear" type="button" class="secondary" style="display:none;">Снять выделение (0/8)</button>
</div>

<div id="cardsList"></div>

<div class="bottom-bar">
  <button id="btnWrite" type="button" disabled>Выберите ключи (0 / 8)</button>
  <div id="log"></div>
</div>

<script>
  const NUS_SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_TX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  const NUS_RX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

  let bleDevice = null, txChar = null, rxChar = null;
  let rxBuffer = new Uint8Array(0);
  let pendingResolver = null;
  let allCards = [], selectedIndices = [];

  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const btnConnect = document.getElementById('btnConnect');
  const btnWrite = document.getElementById('btnWrite');
  const btnClear = document.getElementById('btnClear');
  const searchInput = document.getElementById('searchInput');
  const cardsListEl = document.getElementById('cardsList');

  function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  function hexToBytes(hex) {
    const clean = hex.replace(/[^0-9a-fA-F]/g, '');
    const arr = new Uint8Array(clean.length / 2);
    for (let i = 0; i < arr.length; i++) {
      arr.set(Uint8Array.of(parseInt(clean.substr(i * 2, 2), 16)), i);
    }
    return arr;
  }

  function lrc(bytes) {
    let sum = 0;
    for (let i = 0; i < bytes.length; i++) sum = (sum + bytes.at(i)) & 0xff;
    return (256 - sum) & 0xff;
  }

  function buildFrame(cmd, dataBytes) {
    const data = dataBytes || new Uint8Array(0);
    const frame = new Uint8Array(10 + data.length);
    frame.set(Uint8Array.of(0x11, 0xef, (cmd >> 8) & 0xff, cmd & 0xff, 0, 0, (data.length >> 8) & 0xff, data.length & 0xff), 0);
    frame.set(Uint8Array.of(lrc(frame.slice(2, 8))), 8);
    frame.set(data, 9);
    frame.set(Uint8Array.of(lrc(frame.slice(9, 9 + data.length))), 9 + data.length);
    return frame;
  }

  function handleNotifications(event) {
    const chunk = new Uint8Array(event.target.value.buffer);
    const merged = new Uint8Array(rxBuffer.length + chunk.length);
    merged.set(rxBuffer);
    merged.set(chunk, rxBuffer.length);
    rxBuffer = merged;

    while (rxBuffer.length >= 10) {
      if (rxBuffer.at(0) !== 0x11 || rxBuffer.at(1) !== 0xef) {
        rxBuffer = rxBuffer.slice(1);
        continue;
      }
      const len = (rxBuffer.at(6) << 8) | rxBuffer.at(7);
      const totalLen = 10 + len;
      if (rxBuffer.length < totalLen) break;

      const packet = rxBuffer.slice(0, totalLen);
      rxBuffer = rxBuffer.slice(totalLen);

      const cmd = (packet.at(2) << 8) | packet.at(3);
      const status = (packet.at(4) << 8) | packet.at(5);
      const data = packet.slice(9, 9 + len);

      if (pendingResolver && pendingResolver.cmd === cmd) {
        const res = pendingResolver;
        pendingResolver = null;
        res.resolve({ cmd, status, data });
      }
    }
  }

  async function sendCmd(cmd, dataBytes) {
    if (!txChar) throw new Error('Нет подключения');
    const frame = buildFrame(cmd, dataBytes);
    const respPromise = new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pendingResolver = null; reject(new Error('Таймаут ' + cmd)); }, 5000);
      pendingResolver = { cmd, resolve: (res) => { clearTimeout(timer); resolve(res); } };
    });
    for (let i = 0; i < frame.length; i += 20) {
      await txChar.writeValueWithoutResponse(frame.slice(i, i + 20));
    }
    return await respPromise;
  }

  btnConnect.addEventListener('click', async () => {
    try {
      statusEl.textContent = 'Поиск Chameleon Ultra...';
      statusEl.style.color = '#fff';
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [NUS_SERVICE] }],
        optionalServices: [NUS_SERVICE]
      });
      statusEl.textContent = 'Подключение...';
      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(NUS_SERVICE);
      txChar = await service.getCharacteristic(NUS_TX);
      rxChar = await service.getCharacteristic(NUS_RX);
      await rxChar.startNotifications();
      rxChar.addEventListener('characteristicvaluechanged', handleNotifications);

      const verResp = await sendCmd(1000);
      statusEl.textContent = 'Подключено! Прошивка: v' + verResp.data.at(0) + '.' + verResp.data.at(1);
      statusEl.style.color = '#00e676';
      updateWriteButton();
    } catch (e) {
      statusEl.textContent = 'Ошибка: ' + e.message;
      statusEl.style.color = '#ff5252';
    }
  });
