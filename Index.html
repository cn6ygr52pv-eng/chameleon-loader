<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chameleon Ultra Batch Loader</title>
<style>
  :root { --bg: #121212; --card: #1e1e1e; --accent: #00e676; --text: #ffffff; --muted: #9e9e9e; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 130px; }
  h2 { margin: 0 0 12px 0; font-size: 20px; }
  .panel { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  button { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 12px 16px; font-weight: 700; font-size: 15px; width: 100%; cursor: pointer; }
  button:disabled { background: #424242; color: #888; }
  button.secondary { background: #2c2c2c; color: #fff; margin-top: 8px; }
  input[type="file"], input[type="text"] { width: 100%; box-sizing: border-box; background: #2c2c2c; border: 1px solid #3c3c3c; color: #fff; padding: 10px; border-radius: 8px; font-size: 15px; margin-top: 8px; }
  .card-item { display: flex; align-items: center; justify-content: space-between; background: var(--card); padding: 12px; border-radius: 10px; margin-bottom: 8px; border: 2px solid transparent; }
  .card-item.selected { border-color: var(--accent); background: #182b20; }
  .card-info { flex: 1; padding-right: 10px; }
  .card-name { font-weight: 600; font-size: 16px; }
  .card-uid { font-family: monospace; color: var(--muted); font-size: 13px; margin-top: 3px; }
  .slot-badge { background: var(--accent); color: #000; font-weight: 800; padding: 4px 10px; border-radius: 6px; font-size: 13px; min-width: 52px; text-align: center; }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; padding: 12px 16px; border-top: 1px solid #333; }
  #log { font-family: monospace; font-size: 12px; color: #00e676; white-space: pre-wrap; max-height: 90px; overflow-y: auto; margin-top: 8px; }
</style>
</head>
<body>

<h2>🦎 Пакетная запись Mifare 1K</h2>

<div class="panel">
  <button id="btnConnect">1. Подключить Chameleon Ultra</button>
  <div id="status" style="margin-top:8px; font-size:13px; color:var(--muted);">Статус: Не подключено</div>
</div>

<div class="panel">
  <div style="font-size:14px; font-weight:600;">2. Выберите общий JSON-файл с ключами</div>
  <input type="file" id="fileInput" accept=".json,application/json">
  <input type="text" id="searchInput" placeholder="Поиск по названию или UID..." style="display:none;">
  <button id="btnClear" class="secondary" style="display:none;">Снять выделение (0/8)</button>
</div>

<div id="cardsList"></div>

<div class="bottom-bar">
  <button id="btnWrite" disabled>Выберите ключи (0 / 8)</button>
  <div id="log"></div>
</div>

<script type="module">
  import { Buffer, ChameleonUltra, DeviceMode, FreqType, Mf1EmuWriteMode, Slot, TagType } from 'https://jsdelivr.net';
  import WebbleAdapter from 'https://jsdelivr.net';

  const ultra = new ChameleonUltra();
  ultra.use(new WebbleAdapter());

  let allCards = [];
  let selectedIndices = [];

  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const btnConnect = document.getElementById('btnConnect');
  const btnWrite = document.getElementById('btnWrite');
  const btnClear = document.getElementById('btnClear');
  const searchInput = document.getElementById('searchInput');
  const cardsListEl = document.getElementById('cardsList');

  function log(msg) {
    logEl.textContent += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  btnConnect.onclick = async () => {
    try {
      statusEl.textContent = 'Подключение...';
      await ultra.connect();
      const ver = await ultra.cmdGetAppVersion();
      statusEl.textContent = `Подключено! Прошивка: v${ver}`;
      statusEl.style.color = '#00e676';
      updateWriteButton();
    } catch (e) {
      statusEl.textContent = 'Ошибка BLE: ' + e.message;
      statusEl.style.color = '#ff5252';
    }
  };

  function parseJsonCards(raw) {
    let items = [];
    if (Array.isArray(raw)) {
      items = raw;
    } else if (raw && typeof raw === 'object') {
      if (Array.isArray(raw.cards)) items = raw.cards;
      else if (Array.isArray(raw.data)) items = raw.data;
      else if (raw.Card || raw.blocks) items = [raw];
      else items = Object.entries(raw).map(([k, v]) => ({ name: k, ...(typeof v === 'object' ? v : { uid: v }) }));
    }

    return items.map((item, idx) => {
      const name = item.name || item.nick || item.title || item.label || `Ключ #${idx + 1}`;
      let uid = (item.uid || item.Card?.UID || '').replace(/[^0-9a-fA-F]/g, '');
      let atqa = (item.atqa || item.Card?.ATQA || '0400').replace(/[^0-9a-fA-F]/g, '').padEnd(4, '0').slice(0, 4);
      let sak = (item.sak || item.Card?.SAK || '08').replace(/[^0-9a-fA-F]/g, '').padEnd(2, '0').slice(0, 2);

      let blocks = [];
      const rawBlocks = item.blocks || item.dump || item.sectors;
      if (Array.isArray(rawBlocks)) {
        blocks = rawBlocks.map(b => String(b).replace(/[^0-9a-fA-F]/g, '').padEnd(32, '0').slice(0, 32));
      } else if (rawBlocks && typeof rawBlocks === 'object') {
        for (let i = 0; i < 64; i++) {
          const b = rawBlocks[i] || rawBlocks[String(i)] || '0'.repeat(32);
          blocks.push(String(b).replace(/[^0-9a-fA-F]/g, '').padEnd(32, '0').slice(0, 32));
        }
      }

      if (!uid && blocks[0]) uid = blocks[0].slice(0, 8);
      if (!uid) uid = '11223344';

      // Если дампа не было, создаем 0-й блок с правильным BCC и дефолтными трейлерами секторов
      if (blocks.length === 0) {
        const u = uid.padEnd(8, '0').slice(0, 8);
        const bcc = (parseInt(u.slice(0,2),16) ^ parseInt(u.slice(2,4),16) ^ parseInt(u.slice(4,6),16) ^ parseInt(u.slice(6,8),16)).toString(16).padStart(2,'0');
        blocks[0] = (u + bcc + sak + atqa + '0000000000000000').padEnd(32, '0');
        for (let i = 1; i < 64; i++) {
          blocks.push(i % 4 === 3 ? 'FFFFFFFFFFFFFF078069FFFFFFFFFFFF' : '0'.repeat(32));
        }
      }
      while (blocks.length < 64) blocks.push('0'.repeat(32));

      return { name, uid: uid.toUpperCase(), atqa, sak, blocks };
    });
  }

  document.getElementById('fileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const json = JSON.parse(ev.target.result);
        allCards = parseJsonCards(json);
        selectedIndices = [];
        searchInput.style.display = 'block';
        btnClear.style.display = 'block';
        renderCards();
        updateWriteButton();
      } catch (err) {
        alert('Ошибка чтения JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  };

  searchInput.oninput = () => renderCards();

  btnClear.onclick = () => {
    selectedIndices = [];
    renderCards();
    updateWriteButton();
  };

  function toggleCard(idx) {
    const pos = selectedIndices.indexOf(idx);
    if (pos !== -1) {
      selectedIndices.splice(pos, 1);
    } else {
      if (selectedIndices.length >= 8) {
        alert('Можно выбрать максимум 8 ключей (по числу слотов).');
        return;
      }
      selectedIndices.push(idx);
    }
    renderCards();
    updateWriteButton();
  }

  function renderCards() {
    const query = searchInput.value.toLowerCase();
    cardsListEl.innerHTML = '';
    allCards.forEach((card, idx) => {
      if (query && !card.name.toLowerCase().includes(query) && !card.uid.toLowerCase().includes(query)) return;
      const slotPos = selectedIndices.indexOf(idx);
      const div = document.createElement('div');
      div.className = 'card-item' + (slotPos !== -1 ? ' selected' : '');
      div.innerHTML = `
        <div class="card-info">
          <div class="card-name">${card.name}</div>
          <div class="card-uid">UID: ${card.uid} | SAK: ${card.sak}</div>
        </div>
        ${slotPos !== -1 ? `<div class="slot-badge">Слот ${slotPos + 1}</div>` : ''}
      `;
      div.onclick = () => toggleCard(idx);
      cardsListEl.appendChild(div);
    });
  }

  function updateWriteButton() {
    const count = selectedIndices.length;
    btnClear.textContent = `Снять выделение (${count}/8)`;
    btnWrite.textContent = count > 0 ? `Записать в слоты 1–${count}` : 'Выберите ключи (0 / 8)';
    btnWrite.disabled = !(ultra.isConnected() && count > 0);
  }

  btnWrite.onclick = async () => {
    btnWrite.disabled = true;
    logEl.textContent = '';
    try {
      await ultra.cmdChangeDeviceMode(DeviceMode.EMULATOR);
      const slotEnums = [Slot.SLOT_1, Slot.SLOT_2, Slot.SLOT_3, Slot.SLOT_4, Slot.SLOT_5, Slot.SLOT_6, Slot.SLOT_7, Slot.SLOT_8];

      for (let i = 0; i < selectedIndices.length; i++) {
        const card = allCards[selectedIndices[i]];
        const slot = slotEnums[i];
        log(`[Слот ${i + 1}] Запись: ${card.name} (${card.uid})...`);

        await ultra.cmdSlotChangeTagType(slot, TagType.MIFARE_1024);
        await ultra.cmdSlotResetTagType(slot, TagType.MIFARE_1024);
        await ultra.cmdSlotSetEnable(slot, FreqType.HF, true);
        await ultra.cmdSlotSetActive(slot);

        // Имя слота (до 32 байт UTF-8)
        let nickBuf = Buffer.from(card.name, 'utf8');
        if (nickBuf.length > 32) nickBuf = nickBuf.subarray(0, 32);
        const nick = nickBuf.toString('utf8') || `Slot ${i + 1}`;
        await ultra.cmdSlotSetFreqName(slot, FreqType.HF, nick);

        // Настройки эмулятора M1 и антиколлизии
        await ultra.cmdMf1SetAntiCollMode(false);
        await ultra.cmdMf1SetDetectionEnable(false);
        await ultra.cmdMf1SetWriteMode(Mf1EmuWriteMode.NORMAL);
        await ultra.cmdMf1SetGen1aMode(false);
        await ultra.cmdMf1SetGen2Mode(false);
